[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "congressional-bill-titles-study"
version = "0.1.0"
description = "Scaffolding for a transparent congressional bill-title study."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "textstat>=0.7.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bill_titles"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["congressional-bills", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
